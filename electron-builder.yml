appId: com.opsflow.desktop
productName: ops-flow
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: desktop/build

files:
  - desktop/dist/**
  - '!**/*.map'

extraMetadata:
  main: desktop/dist/main.js
  type: commonjs

extraResources:
  - from: frontend/dist
    to: frontend
  - from: backend/dist
    to: backend/dist
    filter:
      - '!**/*.map'
  - from: backend/package.json
    to: backend/package.json
  - from: .build/backend-runtime/node_modules
    to: backend/node_modules

asar: true

linux:
  executableName: ops-flow
  category: Utility
  maintainer: ops-flow maintainers <ops-flow@users.noreply.github.com>
  icon: desktop/build/icon.png
  target:
    - AppImage
    - deb

win:
  executableName: ops-flow
  icon: desktop/build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true