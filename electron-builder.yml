appId: com.opsflow.desktop
productName: Ops Union
artifactName: ops-union-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: desktop/build

files:
  - desktop/dist/**
  - '!**/*.map'

extraMetadata:
  main: desktop/dist/main.js
  type: commonjs

extraResources:
  - from: frontend/dist
    to: frontend
  - from: backend/dist
    to: backend/dist
    filter:
      - '!**/*.map'
  - from: backend/package.json
    to: backend/package.json
  - from: .build/backend-runtime/node_modules
    to: backend/node_modules

asar: true

linux:
  executableName: ops-union
  syncDesktopName: true
  category: Utility
  maintainer: ops-union maintainers <ops-union@users.noreply.github.com>
  icon: desktop/build/icon.png
  target:
    - AppImage
    - deb

win:
  executableName: ops-union
  icon: desktop/build/icon.ico
  target:
    - nsis

mac:
  category: public.app-category.developer-tools
  icon: desktop/build/icon.icns
  target:
    - dmg
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true